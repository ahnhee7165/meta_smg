<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMG STORE 네이버 GFA 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F2EE; --card:#FDFCFA; --ink:#1D2330; --ink2:#4A5263; --muted:#7D8494; --line:#E4E0D8;
  --accent:#2E5AAC; --accent-soft:#E3EAF7; --warm:#B85C1E; --good:#1F7A4D; --bad:#B42318; --side:#1D2330;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
a{color:inherit}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside.side{background:var(--side);color:#E8EAF0;padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{font-weight:800;letter-spacing:.12em;font-size:18px}
.brand small{display:block;font-weight:500;letter-spacing:0;font-size:12px;color:#A9B0BF;margin-top:6px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{text-decoration:none;padding:9px 12px;border-radius:8px;color:#C9CEDA;font-weight:500}
.side nav a:hover,.side nav a.on{background:#2C3446;color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:#8E95A6;line-height:1.6}
main{padding:28px 32px 60px;min-width:0;max-width:1600px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{margin:0;font-size:24px;font-weight:800}
.top .sub{color:var(--muted);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
select:disabled{opacity:.45}
button{cursor:pointer;font-weight:500}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.range-label{color:var(--ink2);font-size:13px;margin-left:4px}
section{margin-top:28px}
section h2{font-size:17px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:10px}
section h2 .hint{font-size:12px;font-weight:400;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
.kpi .d .d2.up{color:var(--good)} .kpi .d .d2.down{color:var(--bad)} .kpi .d .d2.flat{color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chart-wrap{position:relative;height:300px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left}
td:first-child{white-space:normal;min-width:220px;max-width:420px}
tr.total td{font-weight:700;background:#F1EEE8}
.scroll{overflow:auto;max-height:520px}
.th-sort::after{content:" ↕";color:#C3C6CE}
.th-sort.asc::after{content:" ↑";color:var(--ink)} .th-sort.desc::after{content:" ↓";color:var(--ink)}
.creatives{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cr .img{aspect-ratio:1/1;background:#E9E6E0 center/cover no-repeat;position:relative}
.cr .rank{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px}
.cr .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cr .nm{font-weight:700;font-size:13px;line-height:1.35;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cr .cp{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0;font-size:12px}
.cr dt{color:var(--muted)} .cr dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.cr dd.main{color:var(--accent);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*,.grid3>*{min-width:0}
.grid3 td:first-child{min-width:0;white-space:nowrap}
.grid3 th,.grid3 td{padding:8px 6px}
.bar{height:8px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.barcell .bar{flex:none}
.empty{color:var(--muted);padding:30px;text-align:center}
.dl{display:block;font-size:11px;font-weight:500;margin-top:2px}
.dl.up{color:var(--good)} .dl.down{color:var(--bad)} .dl.flat{color:var(--muted)}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.brand-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.brand-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.brand-card .bn{font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.brand-card .bn small{font-size:11px;font-weight:500;color:var(--muted)}
.brand-card dl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;margin:0;font-size:13px;align-items:baseline}
.brand-card dt{color:var(--muted);white-space:nowrap} .brand-card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.brand-card dd.dd2 .dl{margin:0;font-size:11px}
.notice{background:#FFF7E6;border:1px solid #F2D9A6;color:#6B4A0F;border-radius:10px;padding:12px 14px;margin-top:12px;line-height:1.6}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.creatives{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
@media (max-width:860px){.layout{grid-template-columns:1fr}aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px}.side nav{flex-direction:row;flex-wrap:wrap}.side .foot{display:none}main{padding:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.creatives{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
.side .media{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#151A24;border-radius:10px;padding:4px}
.side .media a{text-align:center;text-decoration:none;padding:8px 2px;border-radius:7px;color:#A9B0BF;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.side .media a.on{background:#2C3446;color:#fff}
body{word-break:keep-all}
.kpi .d span{white-space:nowrap}
.typebar{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.typebar button{padding:9px 18px;font-weight:700;border-radius:999px}
.typebar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.typebar button small{font-weight:500;opacity:.7;margin-left:6px}
.type-card{margin-top:16px}
.type-card td:first-child{min-width:110px}
#regionTable td:first-child,#genderTable td:first-child,#ageTable td:first-child{min-width:0;white-space:nowrap}
#regionTable th,#regionTable td{padding:9px 7px}
.type-card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:baseline;gap:10px}
.type-card h3 small{font-size:12px;font-weight:400;color:var(--muted)}
.search{min-width:200px}
.pname{font-weight:500}
.psub{font-size:11px;color:var(--muted)}
#prodTable td:first-child{min-width:240px;max-width:340px}
#prodTable th,#prodTable td{padding:9px 7px}
.pname{font-size:13px;line-height:1.4}
#catTable td:first-child{min-width:220px}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">SMG STORE<small>네이버 GFA 애드부스트 성과 리포트</small></div>
    <div class="media"><a href="index.html">메타</a><a href="naver.html" title="네이버 검색광고">네이버SA</a><a href="gfa.html" class="on" title="네이버 GFA 애드부스트">GFA</a></div>
    <nav>
      <a href="#summary" class="on">요약</a>
      <a href="#brands">브랜드별</a>
      <a href="#trend">일별 추이</a>
      <a href="#daily">일별 데이터</a>
      <a href="#categories">카테고리</a>
      <a href="#products">상품별</a>
    </nav>
    <div class="foot" id="foot">불러오는 중…</div>
  </aside>
  <main>
    <div class="top" id="summary">
      <div>
        <h1>네이버 GFA 애드부스트 성과</h1>
        <div class="sub" id="sub">데이터를 불러오는 중입니다</div>
      </div>
      <div class="filters">
        <select id="selMonth" aria-label="월"></select>
        <select id="selWeek" aria-label="주차"></select>
        <select id="selDay" aria-label="일"></select>
        <select id="selBrand" aria-label="브랜드"></select>
        <select id="selCat" aria-label="카테고리"></select>
        <input id="search" class="search" type="search" placeholder="상품명 검색" aria-label="상품명 검색" style="font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px">
        <button id="btnCsv">CSV 다운로드</button>
      </div>
    </div>
    <div class="range-label" id="rangeLabel"></div>

    <section>
      <div class="kpis" id="kpis"></div>
    </section>

    <section id="brands">
      <h2>브랜드별 성과 <span class="hint">상품 브랜드 기준 · 카드를 누르면 해당 브랜드만 보기 · 증감은 직전 동일 기간 대비</span></h2>
      <div class="brands" id="brandCards"></div>
      <div class="card scroll"><table id="brandTable"></table></div>
    </section>

    <section id="trend">
      <h2>일별 추이 <span class="hint">지표를 골라 보세요</span></h2>
      <div class="card">
        <div class="tabs" id="trendTabs"></div>
        <div class="chart-wrap"><canvas id="trendChart" aria-label="일별 추이 그래프"></canvas></div>
      </div>
    </section>

    <section id="daily">
      <h2>일별 데이터 <span class="hint">증감은 전일 대비 · 열 제목을 누르면 정렬</span></h2>
      <div class="card scroll"><table id="dayTable"></table></div>
    </section>

    <section id="categories">
      <h2>카테고리별 성과 <span class="hint">열 제목을 누르면 정렬</span></h2>
      <div class="card scroll"><table id="catTable"></table></div>
    </section>

    <section id="products">
      <h2>상품별 성과 <span class="hint" id="prodHint"></span></h2>
      <div class="card scroll" style="max-height:640px"><table id="prodTable"></table></div>
    </section>
  </main>
</div>

<script>
const BRAND_ORDER = ['지포','레드렌서','오피넬','버프','날진','클린켄틴','피코크'];
const S = { rows:[], meta:{}, range:null, brand:'', cat:'', q:'', trendMetric:'spend', sort:{} };
const nf = new Intl.NumberFormat('ko-KR', {maximumFractionDigits:0});
const n0 = v => (v==null||!isFinite(v)) ? '-' : nf.format(Math.round(v));
const won = v => (v==null||!isFinite(v)) ? '-' : nf.format(Math.round(v)) + '원';
const pct = (v,d=2) => (v==null||!isFinite(v)) ? '-' : (v*100).toFixed(d) + '%';
const roasF = v => (v==null||!isFinite(v)) ? '-' : nf.format(Math.round(v*100)) + '%';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SUM_KEYS = ['impressions','clicks','spend','purchases','purchase_value','add_to_cart'];
function sum(rows){
  const t = Object.fromEntries(SUM_KEYS.map(k=>[k,0]));
  for (const r of rows) for (const k of SUM_KEYS) t[k] += +r[k]||0;
  t.ctr = t.impressions ? t.clicks/t.impressions : null;
  t.cpc = t.clicks ? t.spend/t.clicks : null;
  t.cpm = t.impressions ? t.spend/t.impressions*1000 : null;
  t.cpa = t.purchases ? t.spend/t.purchases : null;
  t.roas = t.spend ? t.purchase_value/t.spend : null;
  t.cvr = t.clicks ? t.purchases/t.clicks : null;
  t.aov = t.purchases ? t.purchase_value/t.purchases : null;
  return t;
}

/* ---------- 기간 ---------- */
const weekOf = d => Math.min(5, Math.floor((+d.slice(8,10)-1)/7)+1);
const addDays = (d,n) => { const x=new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)+1;
const fmtD = d => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
function buildMonthOptions(){
  const months = [...new Set(S.rows.map(r=>r.date.slice(0,7)))].sort().reverse();
  document.getElementById('selMonth').innerHTML = ['<option value="r7">최근 7일</option>','<option value="r14">최근 14일</option>','<option value="r30">최근 30일</option>']
    .concat(months.map(m=>`<option value="${m}">${m.slice(0,4)}년 ${+m.slice(5)}월</option>`)).join('');
  document.getElementById('selMonth').value = months[0] || 'r30';
  S.lastDate = S.meta.last_date;
}
function onMonthChange(){
  const m = document.getElementById('selMonth').value, wk = document.getElementById('selWeek');
  if (m.startsWith('r')) { wk.innerHTML='<option value="">주차 전체</option>'; wk.disabled=true; }
  else { const weeks=[...new Set(S.rows.filter(r=>r.date.startsWith(m)).map(r=>weekOf(r.date)))].sort();
    wk.innerHTML='<option value="">주차 전체</option>'+weeks.map(w=>`<option value="${w}">${w}주차</option>`).join(''); wk.disabled=false; }
  fillDays(); applyRange();
}
function fillDays(){
  const m = document.getElementById('selMonth').value, w = document.getElementById('selWeek').value, dy = document.getElementById('selDay');
  let days = [...new Set(S.rows.map(r=>r.date))].sort();
  if (m.startsWith('r')) { const from=addDays(S.lastDate,-(+m.slice(1)-1)); days=days.filter(d=>d>=from && d<=S.lastDate); }
  else days = days.filter(d=>d.startsWith(m) && (!w || weekOf(d)==w));
  dy.innerHTML = '<option value="">일 전체</option>' + days.slice().reverse().map(d=>`<option value="${d}">${fmtD(d)} (${'일월화수목금토'[new Date(d+'T00:00:00Z').getUTCDay()]})</option>`).join('');
}
function applyRange(){
  const m = document.getElementById('selMonth').value, w = document.getElementById('selWeek').value, d = document.getElementById('selDay').value;
  let from, to, label;
  const lastOf = m => new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate();
  if (d) { from=to=d; label=fmtD(d); }
  else if (m.startsWith('r')) { const n=+m.slice(1); to=S.lastDate; from=addDays(to,-(n-1)); label=`최근 ${n}일`; }
  else if (w) { const st=(w-1)*7+1; from=`${m}-${String(st).padStart(2,'0')}`; to=`${m}-${String(w==5?lastOf(m):Math.min(st+6,lastOf(m))).padStart(2,'0')}`; label=`${+m.slice(5)}월 ${w}주차`; }
  else { from=`${m}-01`; to=`${m}-${lastOf(m)}`; label=`${+m.slice(5)}월`; }
  if (S.lastDate && to > S.lastDate) to = S.lastDate;
  const len = daysBetween(from,to);
  S.range = {from,to,label,prevFrom:addDays(from,-len),prevTo:addDays(from,-1)};
  const first = S.meta.first_date;
  const partial = first && S.range.prevFrom < first ? (S.range.prevTo < first ? ' · 직전 기간 데이터 없음' : ` · 직전 기간은 ${first}부터만 데이터 있음`) : '';
  document.getElementById('rangeLabel').textContent = `${label} · ${from} ~ ${to} (${len}일) · 비교: 직전 ${len}일 ${S.range.prevFrom} ~ ${S.range.prevTo}${partial}`;
  render();
}
const inRange = (r,f,t) => r.date>=f && r.date<=t;
const filtOk = (r, skip) => (skip==='brand' || !S.brand || r.brand===S.brand) && (!S.cat || r.category===S.cat) && (!S.q || r.lname.includes(S.q));
const cur = skip => S.rows.filter(r=>inRange(r,S.range.from,S.range.to) && filtOk(r,skip));
const prev = skip => S.rows.filter(r=>inRange(r,S.range.prevFrom,S.range.prevTo) && filtOk(r,skip));

/* ---------- 증감 ---------- */
const RATE = new Set(['ctr','roas','cvr']);
const LOWER = new Set(['cpc','cpa','cpm']);
function deltaHtml(k, c, p){
  if (c==null || p==null || !isFinite(c) || !isFinite(p)) return '<span class="dl flat">직전 없음</span>';
  if (RATE.has(k)) { const d=(c-p)*100; if (Math.abs(d)<0.005) return '<span class="dl flat">–</span>';
    const txt = k==='roas' ? nf.format(Math.round(Math.abs(d)))+'%p' : Math.abs(d).toFixed(2)+'%p';
    return `<span class="dl ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${txt}</span>`; }
  if (!p) return c ? '<span class="dl up">신규</span>' : '<span class="dl flat">–</span>';
  const ch=(c-p)/p; if (Math.abs(ch)<0.0005) return '<span class="dl flat">–</span>';
  const good = LOWER.has(k) ? ch<0 : ch>0;
  return `<span class="dl ${good?'up':'down'}">${ch>0?'▲':'▼'} ${Math.abs(ch*100).toFixed(1)}%</span>`;
}

/* ---------- KPI ---------- */
const KPI = [
  ['spend','광고비',won,true],['impressions','노출',n0],['clicks','클릭',n0],['ctr','CTR',v=>pct(v)],['cpc','CPC',won],['cpm','CPM',won],
  ['purchases','구매',n0,true],['purchase_value','구매 매출',won,true],['roas','ROAS',roasF,true],['cpa','CPA',won],['aov','객단가',won],['add_to_cart','장바구니',n0],
];
function renderKpis(c,p){
  document.getElementById('kpis').innerHTML = KPI.map(([k,label,f,hl])=>{
    const d = (p[k]!=null && c[k]!=null && (p[k] || RATE.has(k))) ? deltaHtml(k,c[k],p[k]).replace('class="dl ','class="d2 ') + ` <span style="color:var(--muted)">(직전 ${f(p[k])})</span>` : '직전 기간 데이터 없음';
    return `<div class="kpi${hl?' hl':''}"><div class="k">${label}</div><div class="v">${f(c[k])}</div><div class="d">${d}</div></div>`;
  }).join('');
}

/* ---------- 추이 ---------- */
const TREND = [['spend','광고비',won,'bar'],['purchase_value','구매 매출',won,'bar'],['purchases','구매',n0,'bar'],['roas','ROAS',roasF,'line'],['impressions','노출',n0,'bar'],['clicks','클릭',n0,'bar'],['ctr','CTR',v=>pct(v),'line'],['cpc','CPC',won,'line'],['cpa','CPA',won,'line']];
let chart;
function renderTrend(rows, prows){
  document.getElementById('trendTabs').innerHTML = TREND.map(([k,l])=>`<button data-k="${k}" class="${k===S.trendMetric?'on':''}">${l}</button>`).join('');
  const days=[]; for(let d=S.range.from; d<=S.range.to; d=addDays(d,1)) days.push(d);
  const by={}; for (const r of rows) (by[r.date] ||= []).push(r);
  const pby={}; for (const r of prows) (pby[r.date] ||= []).push(r);
  const [k,label,f,type] = TREND.find(t=>t[0]===S.trendMetric);
  const pctK = k==='roas'||k==='ctr', conv = v => v==null?null:(pctK?v*100:v);
  const vals = days.map(d=>conv(sum(by[d]||[])[k])), pvals = days.map((d,i)=>conv(sum(pby[addDays(S.range.prevFrom,i)]||[])[k]));
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('trendChart'), {
    type, data:{labels:days.map(fmtD), datasets:[
      {label, data:vals, backgroundColor:'#03C75A', borderColor:'#03A94D', borderWidth:2, borderRadius:4, pointRadius:days.length>45?0:3, tension:.25, spanGaps:true, maxBarThickness:28, order:2},
      {label:'직전 기간', type:'line', data:pvals, borderColor:'#9AA3B5', backgroundColor:'#9AA3B5', borderDash:[5,4], borderWidth:2, pointRadius:0, tension:.25, spanGaps:true, order:1}]},
    options:{maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',align:'end',labels:{boxWidth:14,boxHeight:2,color:'#4A5263'}}, tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label} ${k==='roas'?nf.format(Math.round(ctx.raw))+'%':(k==='ctr'?ctx.raw.toFixed(2)+'%':f(ctx.raw))}`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#7D8494',maxRotation:0,autoSkip:true}}, y:{beginAtZero:true,grid:{color:'#ECE9E3'},border:{display:false},ticks:{color:'#7D8494',callback:v=>pctK?v+'%':nf.format(v)}}}}
  });
}

/* ---------- 표 ---------- */
function table(el, id, cols, rows, total, prevMap, prevTotal, limit){
  const st = S.sort[id] || {k:cols[1].k, dir:'desc'};
  rows = rows.slice().sort((a,b)=>{ const x=a[st.k], y=b[st.k]; if (typeof x==='string') return st.dir==='asc'?x.localeCompare(y):y.localeCompare(x); return st.dir==='asc'?(x??-1)-(y??-1):(y??-1)-(x??-1); });
  if (limit) rows = rows.slice(0, limit);
  const head = '<tr>'+cols.map(c=>`<th class="th-sort ${st.k===c.k?st.dir:''}" data-t="${id}" data-k="${c.k}">${c.l}</th>`).join('')+'</tr>';
  const dl = (c,r,pr) => (pr!==undefined && c.delta) ? deltaHtml(c.k, r[c.k], pr ? pr[c.k] : (RATE.has(c.k)?null:0)) : '';
  const body = rows.map(r=>{ const pr = prevMap ? (prevMap.get(r.name) || null) : undefined;
    return '<tr>'+cols.map(c=>`<td>${c.html?c.html(r):c.f(r[c.k])}${dl(c,r,pr)}</td>`).join('')+'</tr>'; }).join('');
  const tot = total ? '<tr class="total">'+cols.map((c,i)=>`<td>${i===0?'합계':(c.noTotal?'':c.f(total[c.k])+(prevTotal?dl(c,total,prevTotal):''))}</td>`).join('')+'</tr>' : '';
  el.innerHTML = rows.length ? head+tot+body : head+`<tr><td colspan="${cols.length}" class="empty">이 기간 데이터가 없습니다</td></tr>`;
}
document.addEventListener('click', e=>{ const th=e.target.closest('th[data-t]'); if(!th) return; const id=th.dataset.t,k=th.dataset.k,s=S.sort[id]; S.sort[id]={k,dir:s&&s.k===k&&s.dir==='desc'?'asc':'desc'}; render(); });
function groupBy(rows, keyFn, extra){
  const g=new Map(); for (const r of rows){ const k=keyFn(r); if(!g.has(k)) g.set(k,[]); g.get(k).push(r); }
  return [...g].map(([k,rs])=>Object.assign(sum(rs), {name:k}, extra?extra(rs):{}));
}
const toMap = arr => new Map(arr.map(x=>[x.name,x]));
const METRIC_COLS = [
  {k:'spend',l:'광고비',f:won,delta:1},{k:'impressions',l:'노출',f:n0},{k:'clicks',l:'클릭',f:n0,delta:1},{k:'ctr',l:'CTR',f:v=>pct(v),delta:1},{k:'cpc',l:'CPC',f:won,delta:1},
  {k:'purchases',l:'구매',f:n0,delta:1},{k:'purchase_value',l:'구매 매출',f:won,delta:1},{k:'roas',l:'ROAS',f:roasF,delta:1},{k:'cpa',l:'CPA',f:won,delta:1},{k:'cvr',l:'구매율',f:v=>pct(v)},{k:'add_to_cart',l:'장바구니',f:n0,delta:1},
];

function renderBrands(){
  const c=cur('brand'), p=prev('brand');
  const order = BRAND_ORDER.concat(['기타']);
  const rank = n => { const i=order.indexOf(n); return i<0?order.length-1:i; };
  const g = groupBy(c, r=>r.brand).sort((a,b)=>rank(a.name)-rank(b.name)), pm = toMap(groupBy(p, r=>r.brand)), tot = sum(c);
  document.getElementById('brandCards').innerHTML = g.map(b=>{
    const pb = pm.get(b.name)||null, share = tot.spend ? b.spend/tot.spend : 0;
    const row = (l,k,f) => `<dt>${l}</dt><dd>${f(b[k])}</dd><dd class="dd2">${deltaHtml(k,b[k],pb?pb[k]:(RATE.has(k)?null:0))}</dd>`;
    return `<div class="brand-card ${S.brand===b.name?'on':''}" data-brand="${esc(b.name)}"><div class="bn">${esc(b.name)}<small>광고비 비중 ${(share*100).toFixed(0)}%</small></div>
      <dl>${row('광고비','spend',won)}${row('구매 매출','purchase_value',won)}${row('ROAS','roas',roasF)}${row('구매','purchases',n0)}${row('클릭','clicks',n0)}${row('CPC','cpc',won)}</dl></div>`;
  }).join('') || '<div class="empty">이 기간 데이터가 없습니다</div>';
  table(document.getElementById('brandTable'),'brand',[{k:'name',l:'브랜드',f:esc}].concat(METRIC_COLS), g, tot, pm, sum(p));
}
function renderDaily(rows,total){
  const DOW='일월화수목금토', data=groupBy(rows, r=>r.date);
  const byDate = toMap(groupBy(S.rows.filter(r=>filtOk(r)), r=>r.date));
  const prevMap = new Map(data.map(d=>[d.name, byDate.get(addDays(d.name,-1))||null]));
  if (!S.sort.day) S.sort.day = {k:'name',dir:'desc'};
  table(document.getElementById('dayTable'),'day',[{k:'name',l:'날짜',f:d=>`${d} (${DOW[new Date(d+'T00:00:00Z').getUTCDay()]})`}].concat(METRIC_COLS), data, total, prevMap);
}
function renderCats(rows,total,prows,ptotal){
  table(document.getElementById('catTable'),'cat',[{k:'name',l:'카테고리',f:esc}].concat(METRIC_COLS), groupBy(rows, r=>r.category||'(없음)'), total, toMap(groupBy(prows, r=>r.category||'(없음)')), ptotal);
}
function renderProducts(rows,total,prows,ptotal){
  const data = groupBy(rows, r=>r.pid, rs=>({pname:rs[0].pname, brand:rs[0].brand, category:rs[0].category}));
  const cols = [{k:'pname',l:'상품',html:r=>`<div class="pname">${esc(r.pname)}</div><div class="psub">${esc(r.brand)} · ${esc(r.category)}</div>`}].concat(METRIC_COLS);
  const LIMIT = 300;
  table(document.getElementById('prodTable'),'prod',cols, data, total, toMap(groupBy(prows, r=>r.pid)), ptotal, LIMIT);
  document.getElementById('prodHint').textContent = `광고가 노출된 상품 ${n0(data.length)}개${data.length>LIMIT?` 중 정렬 기준 상위 ${LIMIT}개`:''} · 상품명 검색은 상단 검색창`;
}

/* ---------- CSV ---------- */
function downloadCsv(){
  const head=['날짜','브랜드','카테고리','상품명','네이버쇼핑 상품 ID','노출','클릭','광고비','구매','구매매출','장바구니'];
  const lines=[head.join(',')].concat(cur().map(r=>[r.date,r.brand,r.category,r.pname,r.pid,r.impressions,r.clicks,r.spend,r.purchases,r.purchase_value,r.add_to_cart]
    .map(v=>{ v=String(v??''); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }).join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'})); a.download=`smg_gfa_${S.range.from}_${S.range.to}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

function render(){
  const c=cur(), p=prev(), tc=sum(c), tp=sum(p);
  renderKpis(tc,tp); renderBrands(); renderTrend(c,p); renderDaily(c,tc); renderCats(c,tc,p,tp); renderProducts(c,tc,p,tp);
}
async function init(){
  let d = {};
  try { const r = await fetch('data/gfa/products.json?v='+Date.now()); if (r.ok) d = await r.json(); } catch(e){}
  const P = d.products || {};
  S.meta = d.meta || {};
  S.rows = (d.rows||[]).map(a=>{ const p=P[a[1]]||['','기타','']; return {date:a[0], pid:a[1], pname:p[0], lname:p[0].toLowerCase(), brand:p[1]||'기타', category:p[2], spend:a[2], impressions:a[3], clicks:a[4], purchases:a[5], purchase_value:a[6], add_to_cart:a[7]}; });
  document.getElementById('foot').innerHTML = S.meta.updated_at ? `네이버 GFA (보고서 파일)<br>반영 ${esc(S.meta.updated_at)}<br>데이터<br><span style="white-space:nowrap">${esc(S.meta.first_date||'')} ~ ${esc(S.meta.last_date||'')}</span><br>파일 ${(S.meta.files||[]).length}개 누적` : '';
  if (!S.rows.length) { document.getElementById('sub').textContent='아직 반영된 보고서가 없습니다 · data/gfa/raw 폴더에 GFA 상품 보고서 CSV를 올려 주세요'; document.querySelectorAll('main section, .filters, .range-label').forEach(el=>el.style.display='none'); return; }
  document.getElementById('sub').textContent = '구매·구매 매출은 GFA 구매완료 전환 기준 · 상품 보고서(일별) 누적';
  const brands = [...new Set(S.rows.map(r=>r.brand))].sort((a,b)=>{ const ia=BRAND_ORDER.indexOf(a), ib=BRAND_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
  document.getElementById('selBrand').innerHTML = '<option value="">브랜드 전체</option>'+brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  const cats = [...new Set(S.rows.map(r=>r.category).filter(Boolean))].sort();
  document.getElementById('selCat').innerHTML = '<option value="">카테고리 전체</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  buildMonthOptions(); onMonthChange();
}
document.getElementById('selMonth').addEventListener('change', onMonthChange);
document.getElementById('selWeek').addEventListener('change', ()=>{ fillDays(); applyRange(); });
document.getElementById('selDay').addEventListener('change', applyRange);
document.getElementById('selBrand').addEventListener('change', e=>{ S.brand=e.target.value; render(); });
document.getElementById('selCat').addEventListener('change', e=>{ S.cat=e.target.value; render(); });
let qT; document.getElementById('search').addEventListener('input', e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value.trim().toLowerCase(); render(); }, 250); });
document.getElementById('brandCards').addEventListener('click', e=>{ const c=e.target.closest('[data-brand]'); if(!c) return; S.brand = S.brand===c.dataset.brand?'':c.dataset.brand; document.getElementById('selBrand').value=S.brand; render(); });
document.getElementById('btnCsv').addEventListener('click', downloadCsv);
document.getElementById('trendTabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.trendMetric=b.dataset.k; renderTrend(cur(), prev()); });
document.querySelectorAll('.side nav a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.side nav a').forEach(x=>x.classList.remove('on')); a.classList.add('on');}));
init();
</script>
